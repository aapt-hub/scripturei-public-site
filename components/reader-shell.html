<!-- SCRIPTUREi Reader V1 Limited shell
     Review-only presentation state.
     Reads only editions approved for the public Reader catalog.
     Scripture text payload publication remains a separate gate.
-->
<section class="scripture-reader" data-reader aria-label="Bible Reader">
  <div class="reader-panel" role="region" aria-label="Scripture reading panel">
    <header class="reader-header">
      <p class="eyebrow">Reader V1 Limited</p>
      <h2>Open Bible</h2>
      <p>Read the Word of God peacefully.</p>
    </header>

    <nav class="reader-navigation" aria-label="Bible navigation">
      <label>
        Edition
        <select data-reader-edition>
          <option value="kjv-1769">English — King James Version 1769</option>
          <option value="hatbsa">Haitian Creole — Haitian Creole Bible</option>
          <option value="french-lsg-1910">French — Louis Segond 1910</option>
        </select>
      </label>
      <button type="button" disabled>Book</button>
      <button type="button" disabled>Chapter</button>
    </nav>

    <article class="reader-text" aria-live="polite">
      <h3 data-reader-edition-name>King James Version 1769</h3>
      <p><strong>Approved for Reader selection.</strong></p>
      <p>The public Scripture text package has not yet been published, so passage reading remains fail-closed in this review build.</p>
    </article>

    <footer class="reader-tools">
      <button type="button" disabled>A−</button>
      <button type="button" disabled>A+</button>
      <button type="button" disabled>Print</button>
      <button type="button" disabled>Download</button>
      <button type="button" disabled>Share</button>
    </footer>
  </div>
</section>
