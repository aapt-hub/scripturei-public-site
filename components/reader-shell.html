<!-- SCRIPTUREi Reader V1 shell
     Connection to index.html will be enabled in the next integration commit.
-->
<section class="scripture-reader" data-reader hidden aria-label="Bible Reader">
  <div class="reader-panel" role="dialog" aria-modal="true" aria-label="Scripture reading panel">
    <button type="button" data-reader-close>Close</button>
    <header class="reader-header">
      <h2>Open Bible</h2>
      <p>Read the Word of God peacefully.</p>
    </header>

    <nav class="reader-navigation" aria-label="Bible navigation">
      <button type="button">Book</button>
      <button type="button">Chapter</button>
    </nav>

    <article class="reader-text">
      <p>Scripture text will be connected through the validated Scripture source pipeline.</p>
    </article>

    <footer class="reader-tools">
      <button type="button">A−</button>
      <button type="button">A+</button>
      <button type="button">Print</button>
      <button type="button">Download</button>
      <button type="button">Share</button>
    </footer>
  </div>
</section>
